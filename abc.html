<!doctype html>
<html lang="ko" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>연습용 가계부</title><style>
:root{color-scheme:dark;--bg:#101116;--panel:#1d2028;--field:#13161d;--text:#f3f4f7;--muted:#939dac;--border:#303643;--blue:#4a93ff;--green:#73dfb0;--done:#19352c}
html[data-theme=light]{color-scheme:light;--bg:#f5f6f9;--panel:white;--field:#f5f6f9;--text:#202631;--muted:#738091;--border:#dce2eb;--green:#158052;--done:#e5f5ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0;min-height:46px;border-radius:13px;background:var(--panel)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}main{max-width:590px;margin:auto;padding:28px 19px 120px}.header,.monthbar,.sectionhead,.stats{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:1.7px;color:var(--muted)}h1{font-size:29px;letter-spacing:-1px;margin:7px 0 0}.theme{width:46px;font-size:23px}.notice{font-size:12px;line-height:1.7;color:var(--muted);margin:17px 0 23px}.pill{display:inline-block;background:var(--panel);padding:3px 8px;border-radius:6px;color:var(--blue);margin-right:5px}.monthbar{margin-bottom:22px}.monthbar strong{font-size:24px}.nav{display:flex;gap:8px}.nav button{width:44px;font-size:26px}.tabs{display:flex;gap:9px;overflow:auto;margin-bottom:19px;padding-bottom:4px}.tabs button{padding:0 20px;border-radius:99px;white-space:nowrap;font-size:14px}.tabs .active{background:var(--blue);color:white}.tabs .addcard{border:1px dashed var(--muted);background:transparent;color:var(--muted)}.summary{background:var(--panel);padding:25px 23px;border-radius:25px}.label{color:var(--muted);font-size:13px}.total{font-size:42px;font-weight:800;letter-spacing:-1.5px;margin:10px 0 23px}.track{height:9px;border-radius:99px;background:var(--border);overflow:hidden}.bar{height:100%;background:var(--green);transition:width .2s}.progressmeta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:9px}.stats{margin-top:25px;align-items:start}.stats>div:last-child{text-align:right}.stats strong{display:block;font-size:23px;margin-top:8px;letter-spacing:-.6px}.paidtotal{color:var(--green)}section{margin-top:27px}.sectionhead{margin-bottom:12px;padding:0 3px}.sectionhead h2{font-size:18px;margin:0}.sectionhead span{font-size:14px;color:var(--muted)}.list{display:grid;gap:10px}.item{display:flex;border-radius:19px;background:var(--panel);overflow:hidden}.toggle{flex:1;min-width:0;display:flex;align-items:center;text-align:left;gap:12px;padding:20px 0 20px 15px;background:transparent}.circle{height:31px;width:31px;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--border);border-radius:50%;color:transparent}.detail{flex:1;min-width:0}.name{font-weight:700;font-size:14px;line-height:1.6;overflow-wrap:anywhere}.badge{font-size:10px;padding:3px 6px;background:var(--border);border-radius:6px;margin-left:5px;white-space:nowrap}.meta{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.6}.amount{font-size:18px;font-weight:750;white-space:nowrap}.amount small{display:block;font-weight:400;color:var(--muted);font-size:10px;text-align:right;margin-top:5px}.edit{width:39px;flex-shrink:0;color:var(--muted);font-size:21px;background:transparent}.done{background:var(--done)}.done .circle{color:var(--bg);background:var(--green);border-color:var(--green)}.done .name,.done .amount{color:var(--green);text-decoration:line-through}.empty{border:1px dashed var(--border);padding:25px;text-align:center;border-radius:16px;font-size:13px;color:var(--muted)}.footnote{color:var(--muted);font-size:11px;text-align:center;line-height:1.8;margin:28px 0 12px}.reset{display:block;margin:auto;background:transparent;color:var(--muted);font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 25%);padding:17px 19px max(18px,env(safe-area-inset-bottom))}.primary{background:var(--blue);color:white;min-height:53px;border-radius:15px;width:100%;font-weight:700}.bottom button{display:block;max-width:552px;margin:auto}dialog{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:23px;padding:23px;width:calc(100% - 28px);max-width:440px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#0009}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.dialoghead h2{margin:0;font-size:20px}.close{background:var(--border);width:43px}.field{display:grid;gap:8px;color:var(--muted);font-size:13px;margin-bottom:17px}input,select{min-width:0;width:100%;min-height:49px;border:1px solid var(--border);border-radius:12px;padding:11px;background:var(--field);color:var(--text);font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.danger{background:transparent;color:#ef8c95;width:100%;margin-top:9px;font-size:13px}.hint{font-size:11px;line-height:1.7;color:var(--muted)}[hidden]{display:none!important}.toast{position:fixed;z-index:20;bottom:94px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:13px;max-width:90%;text-align:center}@media(max-width:360px){.toggle{gap:9px;padding-left:11px}.name{font-size:13px}.amount{font-size:16px}.edit{width:32px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main><header class="header"><div><span class="eyebrow">MONTHLY LEDGER · DEMO</span><h1>연습용 가계부</h1></div><button class="theme" id="theme" aria-label="라이트 모드로 변경">☼</button></header><p class="notice"><span class="pill">연습용</span>모든 이름과 내역은 가상 데이터입니다.</p><div class="monthbar"><strong id="month"></strong><div class="nav"><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div></div><nav class="tabs" id="tabs" aria-label="카드 선택"></nav><div class="summary"><div class="label" id="summaryLabel"></div><div class="total" id="total"></div><div class="track" id="progress" role="progressbar" aria-label="납부 진행률" aria-valuemin="0" aria-valuemax="100"><div class="bar" id="bar"></div></div><div class="progressmeta"><span id="count"></span><span id="percentage"></span></div><div class="stats"><div><span class="label">낸 금액</span><strong id="paid" class="paidtotal"></strong></div><div><span class="label">남은 금액</span><strong id="remaining"></strong></div></div></div><div id="sections"></div><p class="footnote">항목을 누르면 납부 체크 · ⋯ 버튼으로 수정<br>이 파일의 연습 내역만 브라우저에 저장됩니다.<br>기존 가계부와 연결되지 않습니다.</p><button class="reset" id="reset">연습 데이터 초기화</button></main><div class="bottom"><button class="primary" id="add">＋ 결제 항목 추가</button></div>
<dialog id="entryDialog"><form id="entryForm"><div class="dialoghead"><h2 id="formTitle">결제 항목 추가</h2><button type="button" class="close" data-close="entryDialog" aria-label="닫기">✕</button></div><label class="field">결제 구분<select name="type"><option value="installment">할부</option><option value="normal">일반결제</option></select></label><label class="field">사용처<input name="merchant" required maxlength="60" placeholder="예: 샘플 상점"></label><label class="field">사용일<input name="date" type="date" required min="1900-01-01" max="2200-12-31"></label><div id="installment"><label class="field">할부 총액 (원)<input name="total" type="number" min="1" max="999999999" step="1" inputmode="numeric"></label><div class="grid"><label class="field">이번 회차<input name="current" type="number" min="1" max="600" step="1" inputmode="numeric" value="1"></label><label class="field">전체 회차<input name="months" type="number" min="1" max="600" step="1" inputmode="numeric" value="2"></label></div><p class="hint">당월 금액을 직접 입력해 주세요. 다음 달에 자동 추가되지 않습니다.</p></div><label class="field">당월 결제금액 (원)<input name="amount" type="number" required min="1" max="999999999" step="1" inputmode="numeric"></label><button class="primary" type="submit">저장하기</button><button class="danger" type="button" id="deleteEntry" hidden>이 항목 삭제</button></form></dialog>
<dialog id="cardDialog"><form id="cardForm"><div class="dialoghead"><h2>카드 추가</h2><button class="close" type="button" data-close="cardDialog" aria-label="닫기">✕</button></div><label class="field">연습용 카드 이름<input name="cardName" required maxlength="25" placeholder="예: 샘플 카드 B"></label><button class="primary" type="submit">추가하기</button></form></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
// Standalone practice copy. No real transactions, account details, or original storage keys.
const STORAGE_KEY='anonymous-card-ledger-practice-blank-v2';
const SEED={version:1,theme:'dark',cards:[{id:'demo-card-a',name:'샘플 카드 A'}],months:{'2026-10':{'demo-card-a':[
{id:'demo-1',type:'installment',name:'샘플 안경점',date:'2026-09-20',total:null,current:1,months:2,amount:null,paid:false},
{id:'demo-2',type:'installment',name:'샘플 온라인몰',date:'2026-09-18',total:null,current:2,months:2,amount:null,paid:false},
{id:'demo-3',type:'normal',name:'샘플 식당',date:'2026-10-16',amount:null,paid:false},
{id:'demo-4',type:'normal',name:'샘플 쇼핑몰',date:'2026-10-16',amount:null,paid:false},
{id:'demo-5',type:'normal',name:'샘플 카페',date:'2026-10-15',amount:null,paid:false}
]}}};
const clone=x=>JSON.parse(JSON.stringify(x));
const $=id=>document.getElementById(id),money=n=>n===null?'—':n.toLocaleString('ko-KR')+'원',escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=clone(SEED),storageIssue=false;
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const saved=JSON.parse(raw);if(saved.version===1&&Array.isArray(saved.cards)&&saved.cards.length&&saved.months)state=saved;else storageIssue=true}}catch{storageIssue=true}
let month='2026-10',selected=state.cards[0].id,editing=null;
function entries(){return state.months[month]?.[selected]||[]}
function setEntries(rows){state.months[month]??={};state.months[month][selected]=rows}
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch{notify('이 브라우저에서는 자동 저장이 제한돼요.');return false}}
function render(){document.documentElement.dataset.theme=state.theme;$('theme').textContent=state.theme==='dark'?'☼':'☾';$('theme').setAttribute('aria-label',state.theme==='dark'?'라이트 모드로 변경':'다크 모드로 변경');$('month').textContent=month.replace('-','.');$('prev').disabled=month==='1900-01';$('next').disabled=month==='2200-12';$('tabs').innerHTML=state.cards.map(c=>`<button data-card="${escapeHTML(c.id)}" class="${c.id===selected?'active':''}" aria-pressed="${c.id===selected}">${escapeHTML(c.name)}</button>`).join('')+'<button class="addcard" id="newCard">＋ 카드 추가</button>';
const list=entries(),hasAmounts=list.some(e=>Number.isSafeInteger(e.amount)),sum=list.reduce((a,e)=>a+e.amount,0),paid=list.filter(e=>e.paid).reduce((a,e)=>a+e.amount,0),percent=sum?Math.round(paid/sum*100):0;
$('summaryLabel').textContent='이번 달 '+state.cards.find(c=>c.id===selected).name+' 결제 예정';$('total').textContent=hasAmounts?money(sum):'—';$('paid').textContent=hasAmounts?money(paid):'—';$('remaining').textContent=hasAmounts?money(sum-paid):'—';$('count').textContent=list.filter(e=>e.paid).length+' / '+list.length+'건 납부';$('percentage').textContent=percent+'%';$('bar').style.width=(sum?paid/sum*100:0)+'%';$('progress').setAttribute('aria-valuenow',percent);
$('sections').innerHTML=['installment','normal'].map(type=>{const rows=list.filter(e=>e.type===type);return `<section><div class="sectionhead"><h2>${type==='installment'?'할부':'일반결제'}</h2><span>${rows.some(e=>Number.isSafeInteger(e.amount))?money(rows.reduce((s,e)=>s+e.amount,0)):'—'}</span></div><div class="list">${rows.length?rows.map(e=>`<article class="item ${e.paid?'done':''}"><button class="toggle" data-toggle="${escapeHTML(e.id)}" aria-pressed="${e.paid}" aria-label="${escapeHTML(e.name)} ${money(e.amount)} ${e.paid?'납부 체크 해제':'납부 체크'}"><span class="circle" aria-hidden="true">✓</span><span class="detail"><span class="name">${escapeHTML(e.name)}</span>${type==='installment'?`<span class="badge">${e.current}/${e.months}회</span>`:''}<span class="meta">${escapeHTML(e.date.slice(2).replaceAll('-','.'))}${type==='installment'&&e.total!==null?' · 총 '+money(e.total):''}</span></span><span class="amount">${money(e.amount)}${type==='installment'?'<small>당월 결제</small>':''}</span></button><button class="edit" data-edit="${escapeHTML(e.id)}" aria-label="${escapeHTML(e.name)} 수정">⋯</button></article>`).join(''):'<div class="empty">등록된 내역이 없어요.</div>'}</div></section>`}).join('')}
function move(delta){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+delta,1);if(d.getFullYear()<1900||d.getFullYear()>2200)return;month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function changeType(){const f=$('entryForm'),show=f.elements.type.value==='installment';$('installment').hidden=!show;for(const name of ['total','current','months']){f.elements[name].disabled=!show;f.elements[name].required=show}}
function openEntry(id=null){editing=id;const f=$('entryForm');f.reset();for(const e of f.elements)e.setCustomValidity?.('');const item=entries().find(e=>e.id===id);$('formTitle').textContent=item?'결제 항목 수정':'결제 항목 추가';$('deleteEntry').hidden=!item;if(item){for(const name of ['type','date','total','current','months','amount'])if(item[name]!==undefined)f.elements[name].value=item[name]??'';f.elements.merchant.value=item.name}else f.elements.date.value=month+'-01';changeType();$('entryDialog').showModal()}
$('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('add').onclick=()=>openEntry();
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.card){selected=b.dataset.card;render()}else{$('cardForm').reset();$('cardDialog').showModal()}};
$('sections').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.toggle){const row=entries().find(x=>x.id===b.dataset.toggle);row.paid=!row.paid;save();render();document.querySelector(`[data-toggle="${row.id}"]`)?.focus({preventScroll:true})}else if(b.dataset.edit)openEntry(b.dataset.edit)};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('entryForm').elements.type.onchange=changeType;
$('entryForm').oninput=()=>{for(const el of $('entryForm').elements)el.setCustomValidity?.('')};
$('entryForm').onsubmit=e=>{e.preventDefault();const f=e.target,type=f.elements.type.value,n=k=>Number(f.elements[k].value),name=f.elements.merchant.value.trim();if(!name){f.elements.merchant.setCustomValidity('사용처를 입력해 주세요.');f.elements.merchant.reportValidity();return}if(type==='installment'&&(n('current')>n('months')||n('amount')>n('total'))){notify('회차와 할부 총액을 확인해 주세요.');return}const old=entries().find(x=>x.id===editing),row={id:editing||'demo-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),type,name,date:f.elements.date.value,amount:n('amount'),paid:old?.paid||false};if(type==='installment')Object.assign(row,{total:n('total'),current:n('current'),months:n('months')});setEntries(old?entries().map(x=>x.id===editing?row:x):[...entries(),row]);save();render();$('entryDialog').close()};
$('deleteEntry').onclick=()=>{if(!confirm('이 연습 항목을 삭제할까요?'))return;setEntries(entries().filter(e=>e.id!==editing));save();render();$('entryDialog').close()};
$('cardForm').oninput=e=>e.target.setCustomValidity?.('');$('cardForm').onsubmit=e=>{e.preventDefault();const input=e.target.elements.cardName,name=input.value.trim();if(!name||state.cards.some(c=>c.name===name)){input.setCustomValidity('새로운 카드 이름을 입력해 주세요.');input.reportValidity();return}selected='demo-card-'+Date.now().toString(36);state.cards.push({id:selected,name});save();render();$('cardDialog').close()};
$('reset').onclick=()=>{if(!confirm('연습 내역만 지우고 처음 예시로 되돌릴까요?'))return;state=clone(SEED);month='2026-10';selected=state.cards[0].id;save();render();notify('연습 데이터를 초기화했어요.')};
render();if(storageIssue)notify('저장된 연습 내역을 읽을 수 없어 예시를 표시했어요.');
</script></body></html>
